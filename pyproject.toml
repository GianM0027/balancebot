[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "balancebot"
version = "0.1.0"
description = "Simulation and control of a two-wheeled self-balancing robot, written from scratch"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "sympy"]

[tool.setuptools]
packages = ["balancebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
